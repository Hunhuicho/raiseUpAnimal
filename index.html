const incomeEls = new Map();

function buildIncome() {
  const box = $("incomelist");
  box.innerHTML = "";
  incomeEls.clear();
  for (const c of CHANNELS) {
    const row = document.createElement("div");
    row.className = "inc";
    row.innerHTML = `
      <span class="lb">${c.ico} ${c.label}</span>
      <span class="track"><i style="background:${CH_COLOR[c.k]}"></i></span>
      <span class="amt"><span class="num"></span><span class="buffchip" hidden></span></span>`;
    box.appendChild(row);
    incomeEls.set(c.k, {
      row, bar: row.querySelector("i"),
      amt: row.querySelector(".num"),
      chip: row.querySelector(".buffchip"),
    });

  updateIncome();

function updateIncome() {
  const { parts, total } = income();
  for (const p of parts) {
    const el = incomeEls.get(p.k);
    if (!el) continue;
    const perMin = p.rate * 60;
    const max = p.per * channelMultiplier(p.k) * coinMultiplier();   // 게이지 100일 때의 값
    el.bar.style.width = (max > 0 ? clamp((perMin / max) * 100, 0, 100) : 0) + "%";
    el.row.classList.toggle("off", perMin <= 0);
    el.amt.textContent = perMin > 0 ? `+${perMin.toFixed(1)} / 분` : p.hint;

    const b = S.buffs[p.k];
    el.chip.hidden = !b;
    if (b) {
      const mm = Math.floor(b.left / 60), ss = Math.floor(b.left % 60);
      el.chip.textContent = `×${b.mult} ${mm}:${String(ss).padStart(2, "0")}`;
    }
  }
  $("itotalval").textContent = (total * 60).toFixed(1);
}

const careEls = new Map();

function lockNote(it) {
  const p = PLACES.find((x) => x.id === it.needs);
  if (p) return `${p.icon} ${p.name} 필요`;
  const f = FURNITURE.find((x) => x.id === it.needs);

function updateCare() {
  const urgent = urgentKey();

  for (const g of CARE) {
    const ge = careEls.get("group:" + g.k);
    if (!ge) continue;
    ge.wrap.hidden = g.room !== S.room;      // 그 방에서 할 수 있는 것만 보여준다
    ge.tag.hidden = urgent !== g.k;
  }

  {
    const ge = careEls.get("group:own");
    const mine = CARE.find((c) => c.k === "own").items.find((x) => x.only === S.type);
    if (ge && mine) {
      const p = PETS[S.type];
      ge.wrap.querySelector(".ghead").firstChild.textContent = `${p.emoji} ${p.name}만 할 수 있는 것`;
    }
  }

  for (const it of ALL_ITEMS) {
    const el = careEls.get(it.id);
    if (!el) continue;
    if (it.only) {                       // 종이 다르면 아예 안 보인다
      el.btn.hidden = it.only !== S.type;
      if (el.btn.hidden) continue;
    }
    if (isMinigame(it)) {
      const cd = S.cooldown[it.id];
      el.n.textContent = it.label;
      el.c.textContent = cd > 0 ? Math.ceil(cd) + "초" : "무료";
      el.c.classList.toggle("free", !(cd > 0));
      el.p.textContent = cd > 0 ? "" : "미니게임";
      el.p.classList.remove("zero");
      el.bf.textContent = it.note;
      el.btn.disabled = cd > 0;
      continue;
    }

    if (it.special === "sleep") {
      el.n.textContent = S.asleep ? "깨우기" : "재우기";
      el.c.textContent = "무료";
      el.c.classList.add("free");
      el.p.textContent = S.asleep ? "자는 중" : "";
      el.p.classList.add("zero");
      el.bf.textContent = S.asleep
        ? `게이지 −65% · 수익 ×${SLEEP_INCOME}`
        : it.note;
      el.btn.classList.toggle("urgent", S.asleep);
      el.btn.disabled = false;
      continue;
    }

    const locked = it.needs && !has(it.needs);
    const cd = S.cooldown[it.id];

    el.n.textContent = locked ? "🔒 " + it.label : it.label;

    let costText, free = false;
    if (cd > 0) costText = Math.ceil(cd) + "초";
    else if (it.cost) costText = "🪙 " + itemCost(it);
    else { costText = "무료"; free = true; }
    el.c.textContent = costText;
    el.c.classList.toggle("free", free);

    // 지금 해주면 얼마를 받는지 미리 보여준다 — 무엇을 해줘야 이득인지 한눈에 읽히도록
    const reward = locked ? 0 : itemReward(it);
    el.p.textContent = reward > 0 ? `받음 +${reward}` : "받음 +0";
    el.p.classList.toggle("zero", reward <= 0);

    el.bf.textContent = locked
      ? lockNote(it)
      : it.buff ? `${CH_LABEL[it.ch]}수익 ×${it.buff.mult} ${Math.round(it.buff.secs / 60)}분`
                : (it.note || "");

    const isUrgent = !locked && urgent === it.ch;
    el.btn.classList.toggle("urgent", isUrgent);
    const off = !canDo(it);
    if (el.btn.disabled !== off) el.btn.disabled = off;
  }
}

        <span class="n">${f.name}</span>
        <span class="d">${f.desc}</span>
        <span class="c"></span>`;
      b.title = `${f.name} — ${f.desc}`;

function updateShop() {
  let anyBuyable = false;
  for (const f of FURNITURE) {
    const el = shopEls.get(f.id);
    if (!el) continue;
    const owned = has(f.id);
    const afford = S.coins >= f.cost;
    if (!owned && afford) anyBuyable = true;

    el.c.textContent = owned ? "✓ 보유 중" : "🪙 " + fmt(f.cost);
    el.btn.classList.toggle("done", owned);
    el.btn.classList.toggle("buyable", !owned && afford);
    const off = owned || !afford;
    if (el.btn.disabled !== off) el.btn.disabled = off;
  }
  for (const r of ROOMS) {
    const h = shopEls.get("head:" + r.id);
    if (!h) continue;
    const got = FURNITURE.filter((f) => f.room === r.id && has(f.id)).length;
    h.count.textContent = `${got} / ${h.total}`;
  }

  for (const p of PLACES) {
    const el = shopEls.get(p.id);
    if (!el) continue;
    const owned = has(p.id), afford = S.coins >= p.cost;
    if (!owned && afford) anyBuyable = true;
    el.c.textContent = owned ? "✓ 갈 수 있어요" : "🪙 " + fmt(p.cost);
    el.btn.classList.toggle("done", owned);
    el.btn.classList.toggle("buyable", !owned && afford);
    el.btn.disabled = owned || !afford;
  }
  const ph = shopEls.get("head:places");
  if (ph) ph.count.textContent = `${PLACES.filter((p) => has(p.id)).length} / ${ph.total}`;

  for (const o of OUTFITS) {
    const el = shopEls.get(o.id);
    if (!el) continue;
    // 아이가 둘이면 같은 옷을 두 벌까지 — 한 아이당 한 벌씩
    const cap = S.pets.length, n = ownedCount(o.id), full = n >= cap;
    el.c.textContent = full
      ? (cap > 1 ? `✓ ${n}벌 보유` : "🗄️ 서랍에")
      : (n > 0 ? `한 벌 더 🪙 ${fmt(o.cost)}` : "🪙 " + fmt(o.cost));
    el.btn.classList.toggle("done", full);
    el.btn.classList.toggle("buyable", !full && S.coins >= o.cost);
    el.btn.disabled = full || S.coins < o.cost;
  }
  for (const sl of ["head", "body"]) {
    const oh = shopEls.get("head:" + sl);
    if (oh) {
      const cap = S.pets.length;
      const got = OUTFITS.filter((o) => o.slot === sl).reduce((n, o) => n + ownedCount(o.id), 0);
      oh.count.textContent = cap > 1 ? `${got} / ${oh.total * cap}벌` : `${got} / ${oh.total}`;
    }
  }

  const here = ROOMS.find((x) => x.id === S.room);
  const wh = shopEls.get("head:wall");
  if (wh) {
    wh.count.textContent = `${WALLPAPERS.filter((w) => !w.cost || has(w.id)).length} / ${wh.total}`;
    wh.note.textContent = `고르면 지금 있는 ${here.icon} ${here.name}에 발립니다.`;
  }
  for (const w of WALLPAPERS) {
    const el = shopEls.get(w.id);
    if (!el) continue;
    const owned = !w.cost || has(w.id);
    const inUse = wallpaperOf(S.room).id === w.id;
    el.c.textContent = owned ? (inUse ? "✓ 사용 중" : "🗄️ 서랍에") : "🪙 " + fmt(w.cost);
    el.btn.classList.toggle("done", owned);
    el.btn.classList.toggle("buyable", !owned && S.coins >= w.cost);
    el.btn.disabled = owned || S.coins < w.cost;
  }
  // 살 수 있는 게 생기면 🛒 아이콘에 점을 찍는다
  $("nav").querySelector('[data-tab="shop"] .dot').hidden = !anyBuyable;

  const gc = $("gradcard");
  if (gc) {
    const ready = canGraduate();
    gc.hidden = !ready;
    if (ready) {
      gc.querySelector(".g-d").innerHTML =
        `설비 ${FURNITURE.length}가지를 모두 모았습니다. 지금 가족을 앨범에 남기면`
        + ` <b>발도장 🐾 ${pawsEarned()}개</b>를 받아요.`;
      gc.querySelector("#gradbtn").onclick = graduate;
    }
  }
}

function updateDrawer() {
  for (const sl of ["head", "body"]) {
    const n = drawerEls.get("none:" + sl);
    if (n) {
      const off = !S.wear[sl];
      n.c.textContent = off ? "✓ 지금" : "벗기";
      n.btn.classList.toggle("done", off);
    }
    const d = drawerEls.get("dice:" + sl);
    if (d) {
      const n = randomPool(sl).length;
      d.c.textContent = n ? `${n}벌 중` : "없음";
      d.btn.disabled = !n;
    }
    const c = drawerEls.get("cnt:" + sl);
    if (c) {
      const list = OUTFITS.filter((o) => o.slot === sl);
      const got = list.reduce((n, o) => n + ownedCount(o.id), 0);
      c.count.textContent = `${got} / ${list.length * S.pets.length}벌`;
    }
  }

  for (const o of OUTFITS) {
    const el = drawerEls.get("d:" + o.id);
    if (!el) continue;
    const owned = has(o.id), on = S.wear[o.slot] === o.id;
    el.btn.hidden = !owned;                        // 없는 건 서랍에 안 보인다
    const free = canWear(o.id);
    el.c.textContent = on ? "✓ 입는 중" : free ? "입히기" : "다른 아이가 입는 중";
    el.btn.classList.toggle("done", on);
    el.btn.disabled = !on && !free;
  }

  const here = ROOMS.find((x) => x.id === S.room);
  const wc = drawerEls.get("cnt:wall");
  if (wc) {
    wc.count.textContent =
      `${WALLPAPERS.filter((w) => !w.cost || has(w.id)).length} / ${WALLPAPERS.length}`;
    wc.note.textContent = `고르면 지금 있는 ${here.icon} ${here.name}에 발립니다.`;
  }
  for (const w of WALLPAPERS) {
    const el = drawerEls.get("d:" + w.id);
    if (!el) continue;
    const owned = !w.cost || has(w.id);
    const inUse = wallpaperOf(S.room).id === w.id;
    el.btn.hidden = !owned;
    el.c.textContent = inUse ? "✓ 사용 중" : "바르기";
    el.btn.classList.toggle("done", inUse);
  }

  let got = 0, put = 0;
  for (const f of FURNITURE) {
    const el = drawerEls.get("d:" + f.id);
    if (!el) continue;
    const owned = has(f.id);
    el.btn.hidden = !owned;
    if (owned) got++;
    const away = !!S.stored[f.id];
    if (away) put++;
    el.c.textContent = away ? "꺼내놓기" : `치우기 ${el.room.icon}`;
    el.btn.classList.toggle("done", away);
  }
  const fc = drawerEls.get("cnt:furn");
  if (fc) {
    fc.count.textContent = `${got - put} / ${got} 놓아둠`;
    if (fc.note) fc.note.textContent = put
      ? `${put}개를 서랍에 넣어뒀어요 — 치워도 효과는 그대로입니다.`
      : "누르면 서랍에 넣어둘 수 있어요. 치워도 효과는 그대로입니다.";
  }

  const total = OUTFITS.filter((o) => has(o.id)).length + got +
                WALLPAPERS.filter((w) => w.cost && has(w.id)).length;
  $("drawer-empty").textContent = total
    ? "물건을 누르면 바로 입히거나 바를 수 있어요."
    : "아직 가진 게 없어요 — 🛒 상점에서 사면 여기에 쌓입니다.";
}

function loop(now) {
  requestAnimationFrame(loop);
  if (!S) return;

  const dt = Math.min((now - lastFrame) / 1000, 1);
  lastFrame = now;
  step(dt);

  // 반려동물이 혼자 뭔가를 한다 — 40~70초마다
  idleTimer -= dt;
  if (idleTimer <= 0) {
    idleTimer = 40 + Math.random() * 30;
    const lines = IDLE_LINES[S.type];
    addLog(lines[Math.floor(Math.random() * lines.length)]);
    const n = needBubble();
    if (n) say(n);
    // 아이마다 제자리 근처에서 조금씩 움직인다
    const spots = S.pets.length > 1 ? [38, 62] : [50];
    S.pets.forEach((a, i) => { a.wander = spots[i] + (Math.random() * 14 - 7); });
    renderPets();
  }

  renderTop();
  renderNeedLine();
  renderWish();
  renderStats();
  updateIncome();
  updateRooms();
  updateCare();
  updateShop();   // 🛒 아이콘의 알림 점도 여기서 갱신되므로 탭과 무관하게 돌린다
}

/* ===================== 저장 ===================== */

function save() {
  if (!S) return;
  S.lastSeen = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* 저장 불가 환경 */ }
}

function load(key) {
  try {
    const raw = localStorage.getItem(key || SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

// 지금 저장돼 있는 것을 백업으로 옮긴다. 되돌릴 자리를 만들어 두는 것.
function snapshot() {
  try {
    const cur = localStorage.getItem(SAVE_KEY);
    if (cur) localStorage.setItem(PREV_KEY, cur);
  } catch (e) { /* 저장 불가 환경 */ }
}

// 세이브 한 줄 요약 — 선택 화면과 되돌리기 안내에 쓴다
function saveSummary(obj) {
  if (!obj) return null;
  const pets = obj.pets || (obj.type ? [{ type: obj.type, name: obj.name }] : []);
  if (!pets.length) return null;
  const days = Math.max(1, Math.floor((Date.now() - (obj.born || Date.now())) / 86400000) + 1);
  const ago = Math.max(0, Math.round((Date.now() - (obj.lastSeen || Date.now())) / 60000));
  return {
    pets, days, coins: Math.floor(obj.coins || 0),
    items: Object.keys(obj.owned || {}).length,
    ago: ago < 1 ? "방금" : ago < 60 ? `${ago}분 전` : `${Math.floor(ago / 60)}시간 전`,
  };
}

// 동물마다 돈 버는 방식이 다르므로, 고르기 전에 그 차이를 읽을 수 있어야 한다
function petSummary(p) {
  const speed = (v) => v >= 1.3 ? "빨리 닳음" : v <= 0.7 ? "거의 안 닳음" : "보통";
  const ch = p.ch || {};
  const best = Object.entries(ch).filter(([, v]) => v > 1).sort((a, b) => b[1] - a[1])[0];
  const earn = best
    ? `${CH_LABEL[best[0]]} ${CHANNELS.find((c) => c.k === best[0]).label} 수익 <b>×${best[1]}</b>`
    : `모든 수익 <b>×${p.coin}</b>`;
  return `🍚 ${speed(p.sat)} · 🫧 ${speed(p.cln)} · 💗 ${speed(p.aff)}<br>수익 특성 — ${earn}`;
}

/* 하단 탭은 "무엇을 고를지", 오른쪽 서랍은 "무엇을 고를까"를 맡는다.
   서랍은 무대를 덮지 않고 옆으로 밀기 때문에, 고르는 내내 그 아이가 보인다. */
const TABS = ["care", "shop", "drawer", "log", "tools"];
const TAB_TITLE = { care: "돌보기", shop: "상점", drawer: "서랍", log: "일지", tools: "도구" };
let sideOpen = false;

function syncTabs() {
  document.querySelectorAll("#nav button").forEach((x) =>
    x.classList.toggle("on", sideOpen && x.dataset.tab === tab));
  for (const t of TABS) $("page-" + t).hidden = tab !== t;
  $("sidetitle").textContent = TAB_TITLE[tab] || "";
  document.body.classList.toggle("side-open", sideOpen);
  $("side").setAttribute("aria-hidden", sideOpen ? "false" : "true");
  markNarrow();
  render();
  requestAnimationFrame(syncFloorline);
}

// 무대가 남는 폭이 좁으면 방·탭 버튼에서 글자를 뺀다. 아이콘만으로도 읽히므로.
function markNarrow() {
  document.body.classList.toggle("narrow", window.innerWidth < 760);
}

function openSide(which) {
  if (which) tab = which;
  sideOpen = true;
  syncTabs();
}
function closeSide() {
  if (!sideOpen) return;
  sideOpen = false;
  syncTabs();
}

document.querySelectorAll("#nav button").forEach((b) => {
  b.onclick = () => {
    // 같은 탭을 다시 누르면 닫힌다 — 여닫는 데 버튼 하나면 충분하다
    if (sideOpen && tab === b.dataset.tab) closeSide();
    else openSide(b.dataset.tab);
  };
});
$("sideclose").onclick = closeSide;
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && sideOpen && !document.querySelector(".overlay")) closeSide();
});
window.addEventListener("resize", markNarrow);

/* 오른쪽으로 밀면 닫힌다 — 휴대폰에서 ✕를 겨냥하는 것보다 빠르다 */
(function swipeToClose() {
  const el = $("side");
  let x0 = null, y0 = null;
  el.addEventListener("touchstart", (e) => {
    const t0 = e.touches[0]; x0 = t0.clientX; y0 = t0.clientY;
  }, { passive: true });
  el.addEventListener("touchend", (e) => {
    if (x0 === null) return;
    const t1 = e.changedTouches[0];
    const dx = t1.clientX - x0, dy = t1.clientY - y0;
    if (dx > 60 && Math.abs(dy) < 50) closeSide();   // 세로로 긁는 건 스크롤이므로 뺀다
    x0 = y0 = null;
  }, { passive: true });
})();

/* ===================== 소리 =====================
   음원 파일 없이 Web Audio로 직접 연주한다. 잔잔한 8마디 루프를 한 번에 예약해
   두고 끝나기 직전에 다음 바퀴를 예약하는 식. 브라우저가 사용자 조작 전에는
   소리를 막으므로 첫 클릭에서 시동을 건다. */

const SOUND_KEY = "raiseUpAnimal.sound";
const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);

/* 곡은 둘. 평소에는 발랄하게, 잘 때는 잔잔하게. */
const TRACKS = {
  // 낮 — C·G·Am·F, 통통 튀는 아르페지오
  day: {
    bpm: 116, swing: 0.06,
    chords: [[60,64,67],[60,64,67],[55,59,62],[55,59,62],[57,60,64],[57,60,64],[53,57,60],[53,57,60]],
    melody: [
      [72,76,79,76,72,76,79,84], [83,79,76,79,76,null,72,74],
      [74,79,83,79,74,79,83,86], [81,79,76,74,71,null,74,76],
      [72,76,81,76,72,76,81,84], [79,76,72,76,79,null,84,83],
      [77,72,69,72,77,81,84,81], [79,76,72,67,72,76,79,null],
    ],
    pad: 0.028, bass: 0.10, lead: 0.075, spark: true,
  },
  // 밤 — C·Am·F·G, 느릿한 자장가
  night: {
    bpm: 76, swing: 0,
    chords: [[60,64,67],[60,64,67],[57,60,64],[57,60,64],[53,57,60],[53,57,60],[55,59,62],[55,59,62]],
    melody: [
      [72,null,69,null,67,null,69,null], [67,null,64,null,67,null,null,null],
      [69,null,72,null,69,null,67,null], [64,null,62,null,64,null,null,null],
      [65,null,69,null,72,null,69,null], [67,null,65,null,64,null,null,null],
      [62,null,67,null,71,null,74,null], [72,null,67,null,64,null,null,null],
    ],
    pad: 0.05, bass: 0.11, lead: 0.09, spark: false,
  },
};

const Sound = {
  ctx: null, master: null, bus: null, timer: 0, started: false, track: "night",
  on: (() => { try { return localStorage.getItem(SOUND_KEY) !== "off"; } catch (e) { return true; } })(),

  boot() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.on ? 0.16 : 0;
    this.master.connect(this.ctx.destination);
  },

  tone(freq, at, dur, type, peak, dest, glide) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, at);
    if (glide) o.frequency.exponentialRampToValueAtTime(glide, at + dur);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(peak, at + Math.min(0.06, dur * 0.25));
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(dest || this.master);
    o.start(at); o.stop(at + dur + 0.02);
  },

  // 짧은 잡음 — 낮 곡의 셰이커
  shake(at, peak) {
    const c = this.ctx, n = 0.05, buf = c.createBuffer(1, c.sampleRate * n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = c.createBufferSource(); src.buffer = buf;
    const hp = c.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 5200;
    const g = c.createGain(); g.gain.value = peak;
    src.connect(hp); hp.connect(g); g.connect(this.bus || this.master);
    src.start(at);
  },

  scheduleLoop(from) {
    const T = TRACKS[this.track];
    const beat = 60 / T.bpm, bar = beat * 4;
    for (let i = 0; i < 8; i++) {
      const t0 = from + i * bar, ch = T.chords[i];
      ch.forEach((n, k) => this.tone(hz(n), t0, bar * 0.95, "triangle", T.pad - k * 0.006, this.bus));
      this.tone(hz(ch[0] - 12), t0, beat * 1.4, "sine", T.bass, this.bus);
      this.tone(hz(ch[0] - 12), t0 + beat * 2, beat * 1.2, "sine", T.bass * 0.75, this.bus);
      T.melody[i].forEach((n, k) => {
        if (n == null) return;
        const at = t0 + k * beat * 0.5 + (k % 2 ? beat * T.swing : 0);
        const dur = beat * (T.swing ? 0.4 : 0.9);
        this.tone(hz(n), at, dur, "sine", T.lead, this.bus);
        this.tone(hz(n + 12), at, dur * 0.55, "sine", T.lead * 0.25, this.bus);
      });
      if (T.spark) for (let k = 1; k < 8; k += 2) this.shake(t0 + k * beat * 0.5, 0.05);
    }
    return from + 8 * bar;
  },

  newBus() {
    const g = this.ctx.createGain();
    g.gain.value = 1;
    g.connect(this.master);
    return g;
  },

  start() {
    this.boot();
    if (!this.ctx || this.started) return;
    this.started = true;
    if (this.ctx.state === "suspended") this.ctx.resume();
    this.bus = this.newBus();
    const run = () => {
      const end = this.scheduleLoop(this.ctx.currentTime + 0.1);
      this.timer = setTimeout(run, (end - this.ctx.currentTime - 0.3) * 1000);
    };
    run();
  },

  // 자면 밤 곡, 깨면 낮 곡. 예약해 둔 음은 옛 버스를 서서히 줄여 지운다.
  setTrack(name) {
    if (this.track === name) return;
    this.track = name;
    if (!this.ctx || !this.started) return;
    clearTimeout(this.timer);
    const old = this.bus, t = this.ctx.currentTime;
    old.gain.setValueAtTime(old.gain.value, t);
    old.gain.linearRampToValueAtTime(0.0001, t + 0.6);
    setTimeout(() => old.disconnect(), 1200);
    this.started = false;
    this.start();
  },

  toggle() {
    this.on = !this.on;
    try { localStorage.setItem(SOUND_KEY, this.on ? "on" : "off"); } catch (e) { /* 저장 불가 */ }
    this.boot();
    if (this.ctx) {
      if (this.ctx.state === "suspended") this.ctx.resume();
      this.master.gain.linearRampToValueAtTime(this.on ? 0.16 : 0, this.ctx.currentTime + 0.25);
    }
    if (this.on) this.start();
    return this.on;
  },

  sfx(kind) {
    if (!this.on) return;
    this.boot();
    if (!this.ctx) return;
    if (this.ctx.state === "suspended") this.ctx.resume();
    const t = this.ctx.currentTime;
    if (kind === "care")  [72, 79].forEach((n, i) => this.tone(hz(n), t + i * 0.07, 0.22, "sine", 0.14));
    if (kind === "buy")   [67, 72, 76].forEach((n, i) => this.tone(hz(n), t + i * 0.06, 0.2, "triangle", 0.13));
    if (kind === "wish")  [76, 79, 84].forEach((n, i) => this.tone(hz(n), t + i * 0.08, 0.34, "sine", 0.15));
    if (kind === "sleep") this.tone(hz(55), t, 0.7, "sine", 0.12, null, hz(48));
    if (kind === "swap")  this.tone(hz(64), t, 0.09, "triangle", 0.07);
    if (kind === "photo") { this.tone(1800, t, 0.05, "square", 0.07); this.tone(1200, t + 0.06, 0.07, "square", 0.05); }
  },
};

/* 게임 안 확인창.
   브라우저 confirm()은 샌드박스된 페이지에서 통째로 막히는 일이 있어(그러면
   버튼이 아무 반응도 안 한다) 직접 만든 것을 쓴다. */
function askConfirm(title, body, okLabel) {
  return new Promise((res) => {
    const ov = document.createElement("div");
    ov.className = "overlay";
    ov.innerHTML = `
      <div class="modal">
        <h2>${title}</h2>
        <p>${body}</p>
        <button class="big" id="no">아니요, 그대로 둘래요</button>
        <div class="sub"><button class="danger" id="yes">${okLabel}</button></div>
      </div>`;
    document.body.appendChild(ov);
    const done = (v) => { ov.remove(); res(v); };
    ov.querySelector("#yes").onclick = () => done(true);
    ov.querySelector("#no").onclick = () => done(false);
    ov.onclick = (e) => { if (e.target === ov) done(false); };
  });
}

/* --- 사진 찍기 ---
   화면을 캡처하는 게 아니라 캔버스에 방을 다시 그린다. 외부 라이브러리 없이
   되고, 화면에 없는 액자와 이름표까지 얹을 수 있다. */

const W = 720, H = 720;

function svgToImage(svg, size) {
  const sized = svg.replace("<svg", `<svg width="${size}" height="${size}"`);
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = "data:image/svg+xml," + encodeURIComponent(sized);
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

async function drawPhoto() {
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");

  const room = ROOMS.find((r) => r.id === S.room);
  const wp = wallpaperOf(S.room);
  const pad = 26, cw = W - pad * 2, ch = H - pad * 2 - 74;
  const floorY = pad + ch * 0.62;

  ctx.fillStyle = "#f4ece1"; ctx.fillRect(0, 0, W, H);
  ctx.save();
  roundRect(ctx, pad, pad, cw, ch, 22); ctx.clip();

  let g = ctx.createLinearGradient(0, pad, 0, floorY);
  g.addColorStop(0, wp.w1 || room.w1); g.addColorStop(1, wp.w2 || room.w2);
  ctx.fillStyle = g; ctx.fillRect(pad, pad, cw, floorY - pad);

  g = ctx.createLinearGradient(0, floorY, 0, pad + ch);
  g.addColorStop(0, room.f1); g.addColorStop(1, room.f2);
  ctx.fillStyle = g; ctx.fillRect(pad, floorY, cw, pad + ch - floorY);

  // 벽지 무늬 — 산 벽지가 사진에 안 나오면 산 보람이 없다
  if (wp.pattern) {
    ctx.save();
    ctx.beginPath(); ctx.rect(pad, pad, cw, floorY - pad); ctx.clip();
    const dot = (gap, r, color, off) => {
      ctx.fillStyle = color;
      for (let y = pad + off; y < floorY; y += gap)
        for (let x = pad + off; x < pad + cw; x += gap) {
          ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
        }
    };
    if (wp.pattern === "dot") dot(42, 3.4, "rgba(150,110,140,.18)", 0);
    if (wp.pattern === "star") { dot(56, 2.8, "rgba(110,120,180,.22)", 0); dot(56, 2, "rgba(110,120,180,.14)", 28); }
    if (wp.pattern === "check") {
      ctx.strokeStyle = "rgba(150,120,86,.15)"; ctx.lineWidth = 14;
      for (let x = pad; x < pad + cw; x += 42) { ctx.beginPath(); ctx.moveTo(x, pad); ctx.lineTo(x, floorY); ctx.stroke(); }
      for (let y = pad; y < floorY; y += 42) { ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(pad + cw, y); ctx.stroke(); }
    }
    ctx.restore();
  }

  ctx.fillStyle = "rgba(122,96,68,.16)";
  ctx.fillRect(pad, floorY - 7, cw, 7);

  // 러그 — 밖에서는 그리지 않는다
  if (!room.outdoor) {
    ctx.fillStyle = "rgba(236,216,188,.85)";
    ctx.beginPath();
    ctx.ellipse(W / 2, pad + ch * 0.9, cw * (S.pets.length > 1 ? 0.4 : 0.3), ch * 0.11, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // 가구와 풍경 — 화면에 보이는 것이 사진에도 그대로 나와야 한다
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const decor = [
    ...SCENERY.filter((s) => s.room === S.room).map((s) => ({ e: s.e, x: s.x, y: s.y, s: s.s })),
    ...FURNITURE.filter((f) => shown(f.id) && f.room === S.room)
                .map((f) => ({ e: f.emoji, x: f.x, y: f.y, s: f.s })),
  ];
  for (const d of decor) {
    const sz = Math.round(46 * (d.s || 1));
    ctx.font = `${sz}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    ctx.fillText(d.e, pad + (cw * d.x) / 100, pad + (ch * d.y) / 100);
  }

  // 반려동물 — 여러 마리면 나란히, 옷까지 그대로
  const many = S.pets.length > 1;
  const baseSize = cw * (many ? 0.38 : 0.42);
  const spots = many ? [0.36, 0.64] : [0.5];
  for (let i = 0; i < S.pets.length; i++) {
    const a = S.pets[i];
    const petSize = Math.round(baseSize * stageOf(a).scale);   // 자란 만큼 사진에도 크게
    const px = pad + cw * spots[i] - petSize / 2;
    const py = pad + ch * 0.66 - petSize / 2;
    const layers = [PET_ART[a.type]];
    for (const [slot, fit] of [["body", BODY_FIT], ["head", ACC_FIT]]) {
      const id = a.wear[slot];
      if (!id || !ACC_ART[id]) continue;
      const [dx, dy] = fit[a.type] || [0, 0];
      layers.push(art(`<g transform="translate(${dx} ${dy})">${ACC_ART[id]}</g>`));
    }
    for (const svg of layers) ctx.drawImage(await svgToImage(svg, petSize), px, py, petSize, petSize);
  }
  ctx.restore();

  // 액자 테두리와 이름표
  ctx.strokeStyle = "#e2d3bf"; ctx.lineWidth = 5;
  roundRect(ctx, pad, pad, cw, ch, 22); ctx.stroke();

  const days = Math.max(1, Math.floor((Date.now() - (S.born || Date.now())) / 86400000) + 1);
  ctx.fillStyle = "#4a3b2e"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.font = '800 34px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  ctx.fillText(S.pets.map((a) => a.name).join(" · "), pad + 6, H - 34);
  ctx.fillStyle = "#907a63";
  ctx.font = '700 20px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  const lv = S.pets.map((a, i) => { const q = S.active; S.active = i; const v = bondLevel(); S.active = q; return v; });
  const sgs = S.pets.map((a) => `${stageOf(a).ico}${stageOf(a).name}`).join("/");
  ctx.fillText(`${room.icon} ${room.name} · 함께한 지 ${days}일 · ${sgs} · 친밀도 Lv.${lv.join("/")}`, pad + 6, H - 10);
  ctx.textAlign = "right";
  ctx.fillStyle = "#d9a441";
  ctx.font = '800 22px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  ctx.fillText(mood().text, W - pad - 6, H - 34);

  return new Promise((res) => cv.toBlob((blob) => res(URL.createObjectURL(blob)), "image/png"));
}

  document.body.appendChild(ov);
  ov.querySelector("#close").onclick = () => { URL.revokeObjectURL(url); ov.remove(); };
  ov.querySelector("#dl").onclick = () => { addLog("사진을 찍었다 📷"); toast("사진을 저장했어요"); };
};

/* 세이브 하나를 받아 지금 게임으로 삼는다. 옛 구조도 여기서 손봐 준다. */
function adoptSave(obj) {
  S = obj;
  // 한 마리만 있던 옛 세이브를 배열 구조로 옮긴다
  if (!S.pets) {
    S.pets = [{
      type: S.type, name: S.name, sat: S.sat, cln: S.cln, aff: S.aff,
      bondExp: S.bondExp || 0, asleep: !!S.asleep,
      wear: S.wear || { head: S.outfit || null, body: null },
      buffs: S.buffs || {}, cooldown: S.cooldown || {},
    }];
    for (const k of PET_FIELDS) delete S[k];
  }
  S.active = Math.min(S.active || 0, S.pets.length - 1);
  for (const a of S.pets) {
    a.wear = a.wear || { head: null, body: null };
    if (a.wear.head === undefined) a.wear.head = null;
    if (a.wear.body === undefined) a.wear.body = null;
    a.buffs = a.buffs || {};
    a.cooldown = a.cooldown || {};
    // 성장이 없던 시절의 기록 — 함께한 날수만큼은 이미 자란 것으로 쳐준다
    if (a.growth === undefined) {
      const days = Math.max(0, (Date.now() - (S.born || Date.now())) / 86400000);
      a.growth = Math.min(STAGES[STAGES.length - 1].at, days * 260);
    }
    a.stage = stageIdx(a.growth);
  }
  bindActive(S);
  S.log = S.log || [];
  S.room = S.room || "living";
  S.walls = S.walls || {};
  S.stored = S.stored || {};
  S.owned = S.owned || {};
  // 아직 못 여는 곳에 저장돼 있으면 거실로 돌린다 (기록을 지운 뒤 이어 열 때)
  {
    const r = ROOMS.find((x) => x.id === S.room);
    if (!r || !roomOpen(r)) S.room = "living";
  }
  delete S.outfit;
  if (S.wish === undefined) S.wish = null;
  if (S.wishIn === undefined) S.wishIn = 40;
}

// 오프라인 정산까지 마치고 게임을 띄운다
function resumeFrom(obj, settle) {
  adoptSave(obj);
  const away = settle ? Math.max(0, (Date.now() - (S.lastSeen || Date.now())) / 1000) : 0;
  document.querySelectorAll(".overlay").forEach((x) => x.remove());
  $("pets").innerHTML = "";
  $("room").querySelectorAll(".furn").forEach((x) => x.remove());
  begin();
  if (away > 60) {
    const earned = settleOffline(away);
    addLog(`${Math.floor(away / 60)}분 만에 돌아왔다 — 그동안 ${fmt(earned)}코인이 쌓였다`);
    render();
    showReport(away, earned);
  }
}

/* 오프라인에서도 놀 수 있게 — 제대로 배포된 페이지에서만 등록한다.
   file:// 로 열었거나, 게임만 떼어다 다른 곳에 붙였을 때는 sw.js 가 없으므로
   매니페스트가 걸려 있는지로 판별해 조용히 넘어간다. */
const deployed = () => !!document.querySelector('link[rel="manifest"]');
if ("serviceWorker" in navigator && location.protocol.startsWith("http") && deployed()) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => { /* 없어도 게임은 돈다 */ });
  });
}

(function init() {
  ALBUM = albumData();
  const saved = load();
  if (!saved) { showPicker(); return; }
  resumeFrom(saved, true);
})();
</script>
